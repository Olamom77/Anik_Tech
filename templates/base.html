<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Anik Tech School{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-inner">
      <a href="/" class="logo">Anik <span>Tech</span></a>
      <ul class="nav-links">
        <li><a href="/programs">Programs</a></li>
        <li><a href="/about">About</a></li>
        <li><a href="/admissions">Admissions</a></li>
        <li><a href="/contact">Contact</a></li>
      </ul>
      <a href="/admissions" class="nav-cta">Apply Now</a>
    </div>
  </nav>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <div class="logo">Anik <span>Tech</span></div>
      <p>© 2026 Anik Tech School. All rights reserved.</p>
      <div class="footer-links">
        <a href="/contact">Contact</a>
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
      </div>
    </div>
  </footer>
</body>
</html>
